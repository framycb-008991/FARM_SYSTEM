services:
  - type: web
    name: farm-system-render-demo
    runtime: node
    rootDir: antigravity-programming-ai
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        sync: false
      - key: DEMO_ACCOUNT_SELECTOR_ENABLED
        value: "true"
      - key: MOCK_DEMO_AUTH_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
